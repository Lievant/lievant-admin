# Build spec para AWS Amplify Hosting — apps/web (Next.js 15, output: 'standalone')
#
# Las variables de entorno de Amplify (NEXT_PUBLIC_API_URL, NEXT_PUBLIC_COGNITO_DOMAIN,
# NEXT_PUBLIC_COGNITO_CLIENT_ID, NODE_ENV) se configuran a nivel de la app Amplify
# (ver infrastructure/terraform/environments/staging/main.tf -> aws_amplify_app
# y docs/deploy-staging.md), no en este archivo, para evitar duplicidad.
version: 1
applications:
  - appRoot: apps/web
    frontend:
      phases:
        preBuild:
          commands:
            - until [ -f package.json ] && grep -q '"workspaces"' package.json; do cd ..; done && npm ci --include=dev
        build:
          commands:
            - until [ -f package.json ] && grep -q '"workspaces"' package.json; do cd ..; done && npm run build --workspace=@lievant/web
            - until [ -f package.json ] && grep -q '"workspaces"' package.json; do cd ..; done && ([ -d apps/web/public ] && cp -r apps/web/public apps/web/.next/standalone/apps/web/public || true)
            - until [ -f package.json ] && grep -q '"workspaces"' package.json; do cd ..; done && cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
            - until [ -f package.json ] && grep -q '"workspaces"' package.json; do cd ..; done && cp apps/web/.next/required-server-files.json apps/web/.next/standalone/apps/web/required-server-files.json
      artifacts:
        baseDirectory: .next/standalone
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - apps/web/.next/cache/**/*
